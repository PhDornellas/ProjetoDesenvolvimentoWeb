<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de clientes</title>
</head>

<body>

    <header>

        <img src="imagens/logo.png"
             alt="Logo da Tech Solutions"
             width="200">

        <h1>Login de clientes</h1>

    </header>


    <main>

        <section>

            <form>

                <p>
                    <label for="login">Login (e-mail):</label>
                    <input
                        type="email"
                        id="login"
                        name="login">
                </p>

                <p>
                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha">
                </p>

                <p>
                    <button type="submit">
                        Realizar Login
                    </button>

                    <button type="reset">
                        Limpar
                    </button>
                </p>

            </form>

        </section>


        <section>

            <p>
                <a href="troca-senha.html">
                    Trocar senha
                </a>
            </p>

            <p>
                <a href="cadastro.html">
                    Cadastrar novo cliente
                </a>
            </p>

            <p>
                <a href="index.html">
                    Voltar para a página inicial
                </a>
            </p>

        </section>

    </main>


    <footer>

        <p>
            Tech Solutions - Serviços de TI
        </p>

    </footer>

</body>

</html>
