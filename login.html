<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de clientes</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <header>

        <img src="imagens/logo.png"
             alt="Logo da Tech Solutions"
             width="200">

        <h1>Login de clientes</h1>

    </header>


    <main>

        <section>

            <form>

                <p>
                    <label for="login">Login (e-mail):</label>
                    <input
                        type="email"
                        id="login"
                        name="login">
                </p>

                <p>
                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha">
                </p>

                <p>
                    <button type="button" onclick="realizarLogin()">
                        Realizar Login
                    </button>

                    <button type="button" onclick="limpar()">
                        Limpar
                    </button>
                </p>

                <p id="mensagem" class="mensagem"></p>

            </form>

        </section>


        <section>

            <p>
                <a href="troca-senha.html">
                    Trocar senha
                </a>
            </p>

            <p>
                <a href="cadastro.html">
                    Cadastrar novo cliente
                </a>
            </p>

            <p>
                <a href="index.html">
                    Voltar para a página inicial
                </a>
            </p>

        </section>

    </main>


    <footer>

        <p>
            Tech Solutions - Serviços de TI
        </p>

    </footer>

    <script src="js/validacoes.js"></script>
    <script>
        function realizarLogin() {
            var login = document.getElementById("login").value.trim();
            var senha = document.getElementById("senha").value;
            var erro = "";

            if (login == "") {
                erro = "O login deve ser preenchido.";
            } else if (!emailValido(login)) {
                erro = "O login deve ter formato de e-mail válido.";
            } else if (senha == "") {
                erro = "A senha deve ser preenchida.";
            }

            if (erro != "") {
                document.getElementById("mensagem").innerText = erro;
                return;
            }

            alert("Validação realizada com sucesso");
            sessionStorage.setItem("logado", "sim");
            window.location.href = "index.html";
        }

        function limpar() {
            document.getElementById("login").value = "";
            document.getElementById("senha").value = "";
            document.getElementById("mensagem").innerText = "";
            document.getElementById("login").focus();
        }
    </script>

</body>

</html>
