# Porta do backend Java (o backend Node.js usa a 3001)
server.port=8080

# Banco SQLite, com as chaves estrangeiras ligadas
spring.datasource.url=jdbc:sqlite:techsolutions.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# O SQLite aceita uma escrita por vez: uma conexão basta
spring.datasource.hikari.maximum-pool-size=1
